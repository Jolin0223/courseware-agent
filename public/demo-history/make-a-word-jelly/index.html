<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Make-a-Word - 软萌Q弹拼词课件</title>
    <style>
      :root {
        --cream: #fff7dc;
        --peach: #ffd0d8;
        --peach-strong: #ff8fa7;
        --lemon: #fff44f;
        --mint: #98ff98;
        --sky: #87ceeb;
        --orange: #ffd8a8;
        --lavender: #e0b0ff;
        --ink: #40324f;
        --brown: #6b3c22;
        --white: rgba(255, 255, 255, 0.86);
        --line: rgba(112, 71, 115, 0.16);
        font-family: "Cooper Black", "Baloo 2", "Nunito", "Trebuchet MS", "PingFang SC", sans-serif;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        color: var(--ink);
        background: #000;
        user-select: none;
      }

      button {
        border: 0;
        font: inherit;
        cursor: pointer;
      }

      [hidden] {
        display: none !important;
      }

      .shell {
        position: relative;
        width: min(100vw, 177.78vh);
        aspect-ratio: 16 / 9;
        margin: auto;
        top: 50%;
        transform: translateY(-50%);
        overflow: hidden;
        background:
          url("./assets/04_make_word_stage.png") center / cover no-repeat,
          linear-gradient(145deg, #fff2b8 0%, #ffd2dc 46%, #d7f2ff 100%);
      }

      .shell::before {
        display: none;
      }

      .cloud {
        display: none;
      }

      .cloud.one {
        top: 12%;
        left: 4%;
      }

      .cloud.two {
        right: 12%;
        top: 17%;
        transform: scale(0.76);
        animation-delay: -4s;
      }

      .cloud.three {
        right: 2%;
        bottom: 14%;
        transform: scale(0.62);
        animation-delay: -7s;
      }

      .game {
        position: absolute;
        inset: 12.8% 8.5% 7.7%;
        z-index: 2;
        display: block;
      }

      .topbar {
        position: absolute;
        top: 1.7%;
        right: 2.2%;
        z-index: 4;
        pointer-events: none;
      }

      .win-card {
        border: 2px solid rgba(255, 255, 255, 0.82);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.58)),
          rgba(255, 255, 255, 0.58);
        box-shadow:
          0 18px 44px rgba(111, 72, 102, 0.15),
          inset 0 3px 0 rgba(255, 255, 255, 0.8),
          inset 0 -8px 22px rgba(255, 183, 197, 0.15);
        backdrop-filter: blur(6px);
      }

      .level-pill {
        min-width: clamp(96px, 8.2vw, 126px);
        text-align: center;
        padding: clamp(8px, 0.8vw, 12px) clamp(14px, 1.2vw, 20px);
        border-radius: 999px;
        background:
          radial-gradient(circle at 32% 18%, rgba(255, 255, 255, 0.82), transparent 28%),
          linear-gradient(180deg, rgba(255, 244, 79, 0.96), rgba(255, 201, 73, 0.86));
        color: #7c4b05;
        font-size: clamp(14px, 1.2vw, 20px);
        font-weight: 1000;
        box-shadow: 0 9px 18px rgba(255, 182, 74, 0.28), inset 0 -6px 0 rgba(218, 130, 0, 0.12);
      }

      .play-area {
        position: absolute;
        inset: 10% 4.4% 13.5%;
        display: grid;
        grid-template-columns: minmax(250px, 38%) minmax(0, 1fr);
        align-items: center;
        gap: clamp(20px, 3.6vw, 56px);
      }

      .target-wrap {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
      }

      .target-card {
        width: min(100%, 390px);
        height: min(96%, 430px);
        min-width: 0;
        border-radius: 38px;
        display: grid;
        grid-template-columns: 1fr;
        align-items: center;
        justify-items: center;
        padding: 0;
        overflow: hidden;
        border: 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
      }

      .target-art {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      .target-art::before {
        content: "";
        position: absolute;
        width: 92%;
        aspect-ratio: 1;
        border-radius: 50%;
        background:
          radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.82), transparent 22%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.56), rgba(255, 183, 197, 0.24));
        box-shadow: inset 0 -10px 24px rgba(122, 83, 112, 0.06), 0 18px 36px rgba(111, 72, 102, 0.09);
      }

      .target-img {
        position: absolute;
        inset: 3%;
        z-index: 1;
        width: 94%;
        height: 94%;
        object-fit: contain;
      }

      .target-emoji {
        position: absolute;
        z-index: 0;
        font-size: clamp(58px, 7.2vw, 118px);
        filter: drop-shadow(0 12px 12px rgba(91, 64, 92, 0.16));
      }

      .target-art.has-image .target-emoji {
        display: none;
      }

      .target-img:not([src]),
      .target-img.failed {
        display: none;
      }

      .word-tray {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(12px, 1.35vw, 20px);
        padding: 0;
      }

      .spell-zone {
        width: 100%;
        height: min(78%, 460px);
        display: grid;
        grid-template-rows: auto auto;
        align-items: center;
        align-content: center;
        gap: clamp(20px, 4.2vh, 40px);
      }

      .slot {
        position: relative;
        width: clamp(86px, 6.6vw, 124px);
        height: clamp(82px, 6.3vw, 118px);
        border-radius: 29px;
        border: 3px dashed rgba(255, 143, 167, 0.56);
        background:
          radial-gradient(circle at 35% 18%, rgba(255, 255, 255, 0.88), transparent 27%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.46), rgba(255, 183, 197, 0.22));
        box-shadow:
          inset 0 -8px 18px rgba(255, 143, 167, 0.14),
          0 10px 20px rgba(118, 82, 116, 0.09);
      }

      .slot.empty::after {
        content: "";
        position: absolute;
        inset: 24% 20%;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.48);
      }

      .slot.over {
        transform: scale(1.05);
        border-style: solid;
        border-color: rgba(152, 255, 152, 0.92);
        box-shadow: 0 0 0 10px rgba(152, 255, 152, 0.16), inset 0 -8px 18px rgba(152, 255, 152, 0.18);
      }

      .letter-pool {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(16px, 2vw, 32px);
        padding: 0;
        min-height: 132px;
      }

      .tile {
        width: clamp(92px, 7.3vw, 136px);
        height: clamp(84px, 6.5vw, 122px);
        border-radius: 33px;
        display: grid;
        place-items: center;
        color: var(--brown);
        font-size: clamp(42px, 4.25vw, 72px);
        font-weight: 1000;
        line-height: 1;
        text-shadow: 0 3px 0 rgba(255, 255, 255, 0.86);
        box-shadow:
          0 16px 24px rgba(96, 64, 90, 0.14),
          inset 0 5px 0 rgba(255, 255, 255, 0.74),
          inset 0 -10px 18px rgba(88, 44, 80, 0.1);
        transform-origin: center bottom;
        touch-action: none;
      }

      .tile:not(.placed):hover {
        transform: translateY(-5px) scale(1.04);
      }

      .tile:active {
        transform: scale(0.96, 1.04);
      }

      .tile.vowel {
        color: #993247;
      }

      .tile.placed {
        width: 100%;
        height: 100%;
        border-radius: 26px;
        font-size: clamp(42px, 4.25vw, 72px);
        box-shadow:
          inset 0 4px 0 rgba(255, 255, 255, 0.74),
          inset 0 -8px 16px rgba(88, 44, 80, 0.09);
        animation: settle 0.24s cubic-bezier(0.1, 1.7, 0.3, 1);
      }

      .tile.hidden {
        visibility: hidden;
      }

      .quick-actions {
        position: absolute;
        z-index: 5;
        right: 3%;
        bottom: 3.8%;
        display: flex;
        align-items: center;
        gap: clamp(8px, 0.95vw, 14px);
      }

      .candy-btn {
        width: clamp(44px, 4.2vw, 62px);
        height: clamp(44px, 4.2vw, 62px);
        border-radius: 999px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #503326;
        background:
          radial-gradient(circle at 34% 22%, rgba(255, 255, 255, 0.98) 0 13%, rgba(255, 255, 255, 0.42) 14% 25%, transparent 26%),
          radial-gradient(circle at 62% 75%, rgba(255, 160, 70, 0.26), transparent 34%),
          linear-gradient(180deg, #fff76c, #ffc43d 72%, #f4a51f);
        border: 2px solid rgba(255, 255, 255, 0.78);
        box-shadow:
          0 10px 18px rgba(176, 116, 56, 0.2),
          inset 0 4px 0 rgba(255, 255, 255, 0.72),
          inset 0 -8px 0 rgba(145, 89, 22, 0.12);
      }

      .candy-btn svg {
        width: 46%;
        height: 46%;
        stroke: currentColor;
        stroke-width: 3.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .candy-btn.next {
        background:
          radial-gradient(circle at 34% 22%, rgba(255, 255, 255, 0.98) 0 13%, rgba(255, 255, 255, 0.42) 14% 25%, transparent 26%),
          radial-gradient(circle at 62% 75%, rgba(45, 153, 87, 0.22), transparent 34%),
          linear-gradient(180deg, #c9ffb3, #73e596 72%, #43c96e);
      }

      .candy-btn.reset {
        background:
          radial-gradient(circle at 34% 22%, rgba(255, 255, 255, 0.98) 0 13%, rgba(255, 255, 255, 0.42) 14% 25%, transparent 26%),
          radial-gradient(circle at 62% 75%, rgba(34, 126, 170, 0.22), transparent 34%),
          linear-gradient(180deg, #e4f8ff, #8dd8f4 72%, #59b9dc);
      }

      .candy-btn:active {
        transform: scale(0.96, 1.04);
      }

      .candy-btn:disabled {
        opacity: 0.45;
        filter: grayscale(0.22);
        cursor: default;
        animation: none;
      }

      .candy-btn.ready {
        animation: jellyGlow 0.95s ease-in-out infinite;
      }

      .again-btn {
        width: auto;
        height: auto;
        min-width: clamp(210px, 20vw, 280px);
        min-height: clamp(54px, 5vw, 68px);
        padding: 0 34px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: clamp(20px, 2.1vw, 30px);
        font-weight: 1000;
        letter-spacing: 0;
        text-shadow: 0 2px 0 rgba(66, 98, 54, 0.24);
        background: linear-gradient(180deg, #8ff7a7 0%, #4ed477 72%, #35b861 100%);
        border: 2px solid rgba(255, 255, 255, 0.7);
        box-shadow:
          0 10px 20px rgba(53, 161, 91, 0.24),
          inset 0 -7px 0 rgba(37, 123, 66, 0.18);
      }

      .overlay {
        position: absolute;
        inset: 0;
        z-index: 8;
        display: grid;
        place-items: center;
        padding: 5%;
        background:
          linear-gradient(rgba(255, 247, 220, 0.18), rgba(255, 213, 224, 0.2)),
          url("./assets/04_make_word_cover.png") center / cover no-repeat,
          linear-gradient(145deg, #fff0ad 0%, #ffd0dc 48%, #ccefff 100%);
      }

      .cover-screen {
        padding: 0;
        cursor: pointer;
        background: url("./assets/04_make_word_cover.png") center / cover no-repeat;
      }

      .overlay::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 14% 15%, rgba(255, 255, 255, 0.6) 0 7%, transparent 7.3%),
          radial-gradient(circle at 86% 20%, rgba(255, 255, 255, 0.46) 0 8%, transparent 8.3%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.26));
      }

      .cover-screen::before,
      .cover-screen::after {
        display: none;
      }

      .win-overlay {
        background: rgba(64, 50, 79, 0.24);
        backdrop-filter: blur(2px);
      }

      .win-overlay::before {
        display: none;
      }

      .win-card {
        position: relative;
        z-index: 1;
        width: min(720px, 62%);
        border-radius: 40px;
        padding: clamp(26px, 3vw, 48px);
        text-align: center;
      }

      .win-mascot {
        width: clamp(112px, 13vw, 210px);
        aspect-ratio: 1;
        margin: 0 auto 14px;
        border-radius: 50%;
        background:
          url("./assets/04_make_word_zac.png") center / cover no-repeat,
          radial-gradient(circle at 40% 34%, #ffffff 0 5%, transparent 6%),
          radial-gradient(circle at 36% 42%, #2b1b2c 0 4%, transparent 5%),
          radial-gradient(circle at 64% 42%, #2b1b2c 0 4%, transparent 5%),
          radial-gradient(circle at 50% 60%, #ff9eb0 0 8%, transparent 9%),
          #ffe66d;
        box-shadow: 0 18px 34px rgba(111, 72, 102, 0.18), inset 0 -10px 0 rgba(207, 126, 45, 0.1);
        animation: mascotBounce 1.8s ease-in-out infinite;
      }

      .win-card h2 {
        margin: 0;
        color: #ff9a23;
        font-size: clamp(42px, 5vw, 82px);
        line-height: 1.08;
        text-shadow: 0 4px 0 #fff, 0 14px 22px rgba(255, 145, 45, 0.24);
        letter-spacing: 0;
      }

      .win-card p {
        margin: 18px auto 24px;
        max-width: 520px;
        font-family: "Trebuchet MS", "PingFang SC", sans-serif;
        font-size: clamp(18px, 1.65vw, 28px);
        font-weight: 1000;
        color: #604768;
      }

      .win-card .again-btn {
        margin-top: 4px;
      }

      .burst {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 4;
        opacity: 0;
        background:
          url("./assets/04_make_word_success_burst.png") center 35% / 48% auto no-repeat,
          radial-gradient(circle at 50% 45%, rgba(255, 244, 79, 0.34), transparent 26%);
      }

      .burst.show {
        opacity: 1;
        animation: burstFade 0.82s ease-out both;
      }

      .shake {
        animation: shake 0.34s ease-in-out;
      }

      .successPulse {
        animation: successPulse 0.48s ease-out;
      }

      .drag-proxy {
        position: fixed;
        z-index: 20;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(1.08);
      }

      .confetti {
        position: absolute;
        z-index: 6;
        top: -20px;
        width: 12px;
        height: 18px;
        border-radius: 4px;
        background: var(--peach-strong);
        pointer-events: none;
        animation: confettiFall 0.9s ease-out forwards;
      }

      @keyframes drift {
        0%,
        100% {
          translate: 0 0;
        }
        50% {
          translate: 1.4vw -0.7vw;
        }
      }

      @keyframes pop {
        from {
          transform: scale(0.5);
        }
        to {
          transform: scale(1);
        }
      }

      @keyframes settle {
        0% {
          transform: scale(1.16, 0.82);
        }
        70% {
          transform: scale(0.94, 1.08);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes jellyGlow {
        0%,
        100% {
          transform: translateY(0);
          box-shadow: 0 11px 20px rgba(98, 223, 145, 0.26), inset 0 -7px 0 rgba(33, 127, 67, 0.1);
        }
        50% {
          transform: translateY(-4px);
          box-shadow: 0 0 0 10px rgba(152, 255, 152, 0.22), 0 16px 24px rgba(98, 223, 145, 0.28);
        }
      }

      @keyframes mascotBounce {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-8px) scale(1.03, 0.98);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-12px);
        }
        50% {
          transform: translateX(10px);
        }
        75% {
          transform: translateX(-6px);
        }
      }

      @keyframes successPulse {
        0% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.08);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes burstFade {
        0% {
          opacity: 0;
          transform: scale(0.72);
        }
        25% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: scale(1.16);
        }
      }

      @keyframes confettiFall {
        to {
          transform: translateY(72vh) rotate(420deg);
          opacity: 0;
        }
      }

      @media (max-aspect-ratio: 4/3) {
        .game {
          inset: 13.2% 8.6% 8%;
        }

        .topbar {
          top: 1.5%;
          right: 2.3%;
        }

        .play-area {
          inset: 9.4% 3.6% 13%;
          grid-template-columns: minmax(168px, 30%) minmax(0, 1fr);
          grid-template-rows: 1fr;
          gap: 2%;
        }

        .target-card {
          width: min(100%, 300px);
          height: min(90%, 330px);
        }

        .spell-zone {
          height: min(88%, 410px);
          grid-template-rows: auto auto;
          align-content: center;
          gap: clamp(18px, 3.4vh, 32px);
        }

        .slot {
          width: clamp(82px, 11.6vw, 118px);
          height: clamp(76px, 10.8vw, 110px);
          border-radius: 28px;
        }

        .letter-pool {
          min-height: 112px;
          gap: clamp(8px, 1.35vw, 14px);
        }

        .tile {
          width: clamp(82px, 11.5vw, 118px);
          height: clamp(76px, 10.6vw, 108px);
          border-radius: 29px;
          font-size: clamp(42px, 6.4vw, 64px);
        }

        .quick-actions {
          right: 2.8%;
          bottom: 3.6%;
        }

        .candy-btn {
          width: clamp(40px, 5.5vw, 54px);
          height: clamp(40px, 5.5vw, 54px);
        }

      }
    </style>
  </head>
  <body>
    <main class="shell" aria-label="Make-a-Word 互动拼词课件">
      <span class="cloud one"></span>
      <span class="cloud two"></span>
      <span class="cloud three"></span>

      <section class="game" id="game" aria-live="polite">
        <header class="topbar">
          <div class="level-pill" id="levelPill">Level 1/5</div>
        </header>

        <section class="play-area" aria-label="看图拼词区域">
          <section class="target-wrap">
            <div class="target-card" id="targetCard">
              <div class="target-art">
                <span class="target-emoji" id="targetEmoji">🐱</span>
                <img class="target-img" id="targetImg" alt="" />
              </div>
            </div>
          </section>

          <section class="spell-zone">
            <section class="word-tray" id="wordTray" aria-label="单词槽位"></section>
            <section class="letter-pool" id="letterPool" aria-label="字母池"></section>
          </section>
        </section>

        <div class="quick-actions" aria-label="操作按钮">
          <button class="candy-btn" id="soundBtn" type="button" aria-label="发音">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9v6h4l5 4V5L8 9H4Z"></path>
              <path d="M16 9.5c1.2 1.5 1.2 3.5 0 5"></path>
              <path d="M18.5 7c2.4 2.9 2.4 7.1 0 10"></path>
            </svg>
          </button>
          <button class="candy-btn reset" id="resetBtn" type="button" aria-label="重来">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7v6h6"></path>
              <path d="M5.5 13a7 7 0 1 0 2-7"></path>
            </svg>
          </button>
        </div>
      </section>

      <div class="burst" id="burst" aria-hidden="true"></div>

      <section class="overlay cover-screen" id="startOverlay" role="button" tabindex="0" aria-label="点击任意位置开始"></section>

      <section class="overlay win-overlay" id="winOverlay" hidden>
        <div class="win-card">
          <div class="win-mascot" aria-hidden="true"></div>
          <h2>Great Job!</h2>
          <p>你完成了 5 个单词。</p>
          <button class="again-btn" id="againBtn" type="button">Try Again!</button>
        </div>
      </section>
    </main>

    <script>
      const levels = [
        {
          word: "CAT",
          emoji: "🐱",
          image: "./assets/04_make_word_target_cat.png",
          audio: "./assets/audio/word_cat.mp3",
          letters: ["T", "C", "A"]
        },
        {
          word: "DOG",
          emoji: "🐶",
          image: "./assets/04_make_word_target_dog.png",
          audio: "./assets/audio/word_dog.mp3",
          letters: ["G", "D", "O"]
        },
        {
          word: "PIG",
          emoji: "🐷",
          image: "./assets/04_make_word_target_pig.png",
          audio: "./assets/audio/word_pig.mp3",
          letters: ["I", "G", "P"]
        },
        {
          word: "BUS",
          emoji: "🚌",
          image: "./assets/04_make_word_target_bus.png",
          audio: "./assets/audio/word_bus.mp3",
          letters: ["S", "B", "U"]
        },
        {
          word: "FISH",
          emoji: "🐟",
          image: "./assets/04_make_word_target_fish.png",
          audio: "./assets/audio/word_fish.mp3",
          letters: ["S", "F", "H", "I"]
        }
      ];

      const feedbackAudio = {
        greatJob: "./assets/audio/great_job.mp3",
        tryAgain: "./assets/audio/try_again.mp3"
      };

      const sfxAudio = {
        tap: "./assets/audio/sfx_tap_pop.mp3",
        right: "./assets/audio/sfx_right.mp3",
        wrong: "./assets/audio/sfx_wrong.mp3"
      };

      const colorMap = {
        A: "linear-gradient(180deg, #ffd8e1, #ff9eb0)",
        E: "linear-gradient(180deg, #ffd8e1, #ff9eb0)",
        I: "linear-gradient(180deg, #ffd8e1, #ff9eb0)",
        O: "linear-gradient(180deg, #ffd8e1, #ff9eb0)",
        U: "linear-gradient(180deg, #ffd8e1, #ff9eb0)",
        B: "linear-gradient(180deg, #d8f3ff, #87ceeb)",
        D: "linear-gradient(180deg, #d8f3ff, #87ceeb)",
        P: "linear-gradient(180deg, #dfffe0, #98ff98)",
        C: "linear-gradient(180deg, #fffbd0, #fff44f)",
        G: "linear-gradient(180deg, #fffbd0, #fff44f)",
        F: "linear-gradient(180deg, #fffbd0, #fff44f)",
        S: "linear-gradient(180deg, #dfffe0, #98ff98)",
        H: "linear-gradient(180deg, #ffe9cd, #ffd8a8)",
        T: "linear-gradient(180deg, #ffe9cd, #ffd8a8)"
      };

      const vowels = new Set(["A", "E", "I", "O", "U"]);
      const state = {
        index: 0,
        placed: [],
        solved: false,
        completed: 0,
        drag: null,
        advanceTimer: null
      };

      const els = {
        levelPill: document.querySelector("#levelPill"),
        targetEmoji: document.querySelector("#targetEmoji"),
        targetImg: document.querySelector("#targetImg"),
        targetCard: document.querySelector("#targetCard"),
        wordTray: document.querySelector("#wordTray"),
        letterPool: document.querySelector("#letterPool"),
        soundBtn: document.querySelector("#soundBtn"),
        resetBtn: document.querySelector("#resetBtn"),
        startOverlay: document.querySelector("#startOverlay"),
        winOverlay: document.querySelector("#winOverlay"),
        againBtn: document.querySelector("#againBtn"),
        burst: document.querySelector("#burst")
      };

      const audioCache = new Map();
      let activeAudio = null;

      function getAudio(src) {
        if (!src) return null;
        if (!audioCache.has(src)) {
          const audio = new Audio(src);
          audio.preload = "auto";
          audioCache.set(src, audio);
        }
        return audioCache.get(src);
      }

      function stopActiveAudio() {
        if (!activeAudio) return;
        activeAudio.pause();
        activeAudio.currentTime = 0;
        activeAudio = null;
      }

      function playAudio(src, fallback) {
        const audio = getAudio(src);
        if (!audio) {
          if (fallback) fallback();
          return;
        }
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        if (activeAudio && activeAudio !== audio) stopActiveAudio();
        activeAudio = audio;
        audio.pause();
        audio.currentTime = 0;
        const attempt = audio.play();
        if (attempt?.catch) {
          attempt.catch(() => {
            activeAudio = null;
            if (fallback) fallback();
          });
        }
      }

      function playSfx(name, volume = 0.42) {
        const src = sfxAudio[name];
        if (!src) return;
        const base = getAudio(src);
        if (!base) return;
        const audio = base.cloneNode();
        audio.volume = volume;
        const attempt = audio.play();
        if (attempt?.catch) attempt.catch(() => {});
      }

      function renderLevel() {
        const level = levels[state.index];
        clearAdvanceTimer();
        state.placed = Array(level.word.length).fill(null);
        state.solved = false;
        els.levelPill.textContent = `Level ${state.index + 1}/5`;
        els.targetEmoji.textContent = level.emoji;
        els.targetImg.classList.remove("failed");
        els.targetImg.src = level.image;
        els.targetImg.alt = level.word;
        renderSlots(level);
        renderTiles(level);
      }

      function renderSlots(level) {
        els.wordTray.innerHTML = "";
        [...level.word].forEach((_, idx) => {
          const slot = document.createElement("button");
          slot.className = "slot empty";
          slot.type = "button";
          slot.dataset.slot = idx;
          slot.setAttribute("aria-label", `第 ${idx + 1} 个字母槽`);
          slot.addEventListener("click", () => returnTile(idx));
          els.wordTray.appendChild(slot);
        });
      }

      function renderTiles(level) {
        els.letterPool.innerHTML = "";
        level.letters.forEach((letter, idx) => {
          const tile = createTile(letter, `${state.index}-${idx}`);
          els.letterPool.appendChild(tile);
        });
      }

      function createTile(letter, id) {
        const tile = document.createElement("button");
        tile.className = `tile${vowels.has(letter) ? " vowel" : ""}`;
        tile.type = "button";
        tile.textContent = letter;
        tile.dataset.letter = letter;
        tile.dataset.id = id;
        tile.style.background = colorMap[letter] || "linear-gradient(180deg, #fff, #ffe1f0)";
        tile.addEventListener("pointerdown", startDrag);
        tile.addEventListener("click", (event) => {
          if (event.detail !== 0 && !tile.classList.contains("hidden")) {
            placeNext(tile);
          }
        });
        return tile;
      }

      function startDrag(event) {
        const tile = event.currentTarget;
        if (state.solved || tile.classList.contains("hidden")) return;
        playSfx("tap", 0.45);
        const startX = event.clientX;
        const startY = event.clientY;
        state.drag = { tile, proxy: null, moved: false, startX, startY };
        tile.setPointerCapture(event.pointerId);
        tile.addEventListener("pointermove", moveDrag);
        tile.addEventListener("pointerup", endDrag, { once: true });
        tile.addEventListener("pointercancel", cancelDrag, { once: true });
      }

      function moveDrag(event) {
        if (!state.drag) return;
        const distance = Math.hypot(event.clientX - state.drag.startX, event.clientY - state.drag.startY);
        state.drag.moved = state.drag.moved || distance > 8;
        if (state.drag.moved && !state.drag.proxy) {
          const proxy = state.drag.tile.cloneNode(true);
          proxy.classList.add("drag-proxy");
          proxy.style.width = `${state.drag.tile.offsetWidth}px`;
          proxy.style.height = `${state.drag.tile.offsetHeight}px`;
          document.body.appendChild(proxy);
          state.drag.tile.classList.add("hidden");
          state.drag.proxy = proxy;
        }
        if (!state.drag.proxy) return;
        moveProxy(event.clientX, event.clientY);
        document.querySelectorAll(".slot").forEach((slot) => slot.classList.remove("over"));
        const slot = findSlotAt(event.clientX, event.clientY);
        if (slot && !state.placed[Number(slot.dataset.slot)]) slot.classList.add("over");
      }

      function endDrag(event) {
        if (!state.drag) return;
        const { tile, proxy, moved } = state.drag;
        const slot = moved ? findSlotAt(event.clientX, event.clientY) : null;
        cleanupDrag(tile, proxy);
        if (moved && slot && !state.placed[Number(slot.dataset.slot)]) {
          placeInSlot(tile, Number(slot.dataset.slot));
          return;
        }
        if (moved) tile.classList.remove("hidden");
        placeNext(tile);
      }

      function cancelDrag() {
        if (!state.drag) return;
        cleanupDrag(state.drag.tile, state.drag.proxy);
        state.drag.tile.classList.remove("hidden");
      }

      function cleanupDrag(tile, proxy) {
        tile.removeEventListener("pointermove", moveDrag);
        if (proxy) proxy.remove();
        document.querySelectorAll(".slot").forEach((slot) => slot.classList.remove("over"));
        state.drag = null;
      }

      function moveProxy(x, y) {
        if (!state.drag.proxy) return;
        state.drag.proxy.style.left = `${x}px`;
        state.drag.proxy.style.top = `${y}px`;
      }

      function findSlotAt(x, y) {
        const previousPointer = state.drag?.proxy.style.pointerEvents;
        if (state.drag) state.drag.proxy.style.pointerEvents = "none";
        const found = document.elementFromPoint(x, y)?.closest(".slot");
        if (state.drag) state.drag.proxy.style.pointerEvents = previousPointer || "none";
        return found;
      }

      function placeNext(tile) {
        if (state.solved || tile.classList.contains("hidden") && !state.drag) return;
        const slotIndex = state.placed.findIndex((item) => item === null);
        if (slotIndex >= 0) placeInSlot(tile, slotIndex);
      }

      function placeInSlot(tile, slotIndex) {
        if (state.solved || state.placed[slotIndex]) {
          tile.classList.remove("hidden");
          return;
        }
        const slot = els.wordTray.querySelector(`[data-slot="${slotIndex}"]`);
        const placed = tile.cloneNode(true);
        placed.classList.add("placed");
        placed.classList.remove("hidden");
        placed.addEventListener("click", () => returnTile(slotIndex));
        slot.innerHTML = "";
        slot.classList.remove("empty");
        slot.appendChild(placed);
        state.placed[slotIndex] = {
          letter: tile.dataset.letter,
          id: tile.dataset.id,
          source: tile
        };
        tile.classList.add("hidden");
        checkAnswer();
      }

      function returnTile(slotIndex) {
        if (state.solved || !state.placed[slotIndex]) return;
        const item = state.placed[slotIndex];
        item.source.classList.remove("hidden");
        state.placed[slotIndex] = null;
        const slot = els.wordTray.querySelector(`[data-slot="${slotIndex}"]`);
        slot.innerHTML = "";
        slot.classList.add("empty");
      }

      function checkAnswer() {
        if (state.placed.some((item) => item === null)) return;
        const answer = state.placed.map((item) => item.letter).join("");
        const target = levels[state.index].word;
        if (answer === target) {
          markSuccess();
        } else {
          markWrong();
        }
      }

      function markSuccess() {
        state.solved = true;
        state.completed = Math.max(state.completed, state.index + 1);
        els.targetCard.classList.add("successPulse");
        els.burst.classList.remove("show");
        void els.burst.offsetWidth;
        els.burst.classList.add("show");
        popConfetti();
        playSfx("right", 0.5);
        window.setTimeout(speakWord, 1120);
        window.setTimeout(() => els.targetCard.classList.remove("successPulse"), 520);
        state.advanceTimer = window.setTimeout(autoAdvance, state.index === levels.length - 1 ? 2400 : 2050);
      }

      function clearAdvanceTimer() {
        if (!state.advanceTimer) return;
        window.clearTimeout(state.advanceTimer);
        state.advanceTimer = null;
      }

      function autoAdvance() {
        state.advanceTimer = null;
        if (!state.solved) return;
        goNext();
      }

      function markWrong() {
        playSfx("wrong", 0.58);
        els.wordTray.classList.remove("shake");
        void els.wordTray.offsetWidth;
        els.wordTray.classList.add("shake");
        window.setTimeout(() => {
          state.placed.forEach((item, idx) => {
            if (item) returnTile(idx);
          });
          els.wordTray.classList.remove("shake");
        }, 620);
      }

      function popConfetti() {
        const colors = ["#ff8fa7", "#fff44f", "#98ff98", "#87ceeb", "#e0b0ff", "#ffa500"];
        for (let i = 0; i < 34; i += 1) {
          const piece = document.createElement("span");
          piece.className = "confetti";
          piece.style.left = `${18 + Math.random() * 64}%`;
          piece.style.background = colors[i % colors.length];
          piece.style.animationDelay = `${Math.random() * 0.18}s`;
          piece.style.transform = `rotate(${Math.random() * 160}deg)`;
          document.querySelector(".shell").appendChild(piece);
          window.setTimeout(() => piece.remove(), 1100);
        }
      }

      function speakWord() {
        const level = levels[state.index];
        const word = level.word;
        playAudio(level.audio, () => speakWordWithBrowser(word));
      }

      function speakWordWithBrowser(word) {
        stopActiveAudio();
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(word.toLowerCase());
          utterance.lang = "en-US";
          utterance.rate = 0.72;
          utterance.pitch = 1.1;
          window.speechSynthesis.speak(utterance);
        }
      }

      function goNext() {
        if (state.index === levels.length - 1) {
          els.winOverlay.hidden = false;
          playAudio(feedbackAudio.greatJob);
          return;
        }
        state.index += 1;
        renderLevel();
        window.setTimeout(speakWord, 180);
      }

      function restartAll() {
        clearAdvanceTimer();
        state.index = 0;
        state.completed = 0;
        els.winOverlay.hidden = true;
        renderLevel();
      }

      els.targetImg.addEventListener("load", () => {
        els.targetImg.classList.remove("failed");
        els.targetImg.closest(".target-art").classList.add("has-image");
      });
      els.targetImg.addEventListener("error", () => {
        els.targetImg.classList.add("failed");
        els.targetImg.closest(".target-art").classList.remove("has-image");
      });
      els.soundBtn.addEventListener("click", speakWord);
      els.resetBtn.addEventListener("click", renderLevel);
      function enterGame() {
        els.startOverlay.hidden = true;
        speakWord();
      }

      els.startOverlay.addEventListener("click", enterGame);
      els.startOverlay.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") enterGame();
      });
      els.againBtn.addEventListener("click", () => {
        playAudio(feedbackAudio.tryAgain);
        restartAll();
      });

      renderLevel();
    </script>
  </body>
</html>
