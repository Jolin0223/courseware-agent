<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg{fill:#F6F9FC}
      .lane{fill:#FFFFFF;stroke:#D8E5EF;stroke-width:2}
      .card{fill:#FFFFFF;stroke:#C9D8EA;stroke-width:2}
      .decision{fill:#FFF7ED;stroke:#FDBA74;stroke-width:2}
      .ok{fill:#ECFDF5;stroke:#86EFAC;stroke-width:2}
      .warn{fill:#FEF2F2;stroke:#FCA5A5;stroke-width:2}
      .blue{fill:#EFF6FF;stroke:#93C5FD;stroke-width:2}
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#102033}
      .laneTitle{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}
      .h{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#102033}
      .t{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#526174}
      .s{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#64748B}
      .yes{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#047857}
      .no{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#B45309}
      .arrow{stroke:#64748B;stroke-width:2.2;marker-end:url(#arrow)}
      .arrow2{stroke:#00A67D;stroke-width:2.2;marker-end:url(#arrowGreen)}
      .dash{stroke:#94A3B8;stroke-width:2;stroke-dasharray:6 6;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#00A67D"/>
    </marker>
  </defs>
  <rect width="1600" height="980" class="bg"/>
  <text x="48" y="56" class="title">AI互动课件发布弹窗 AI 自动打标流程图</text>
  <text x="48" y="86" class="t">核心口径：按钮始终展示；单权限自动先打一次；多权限本期手动触发；人工改过后再次打标需确认；失效标签阻断发布。</text>

  <rect x="48" y="120" width="1460" height="150" rx="18" class="lane"/>
  <text x="72" y="150" class="laneTitle">A. 打开弹窗与资源库判断</text>
  <rect x="80" y="176" width="150" height="64" rx="12" class="card"/>
  <text x="104" y="202" class="h">打开发布弹窗</text>
  <text x="104" y="224" class="t">读取课件信息</text>
  <line x1="230" y1="208" x2="286" y2="208" class="arrow"/>
  <path d="M350 170L430 208L350 246L270 208Z" class="decision"/>
  <text x="316" y="204" class="h">发布到</text>
  <text x="305" y="224" class="t">哪类资源库？</text>
  <line x1="430" y1="208" x2="506" y2="208" class="arrow"/>
  <rect x="520" y="176" width="190" height="64" rx="12" class="blue"/>
  <text x="544" y="202" class="h">集团资源库</text>
  <text x="544" y="224" class="t">知识点标签 + 内容标签</text>
  <line x1="710" y1="208" x2="746" y2="208" class="arrow"/>
  <rect x="760" y="176" width="190" height="64" rx="12" class="blue"/>
  <text x="784" y="202" class="h">校本资源库</text>
  <text x="784" y="224" class="t">校本标签 + 内容标签</text>
  <line x1="950" y1="208" x2="986" y2="208" class="arrow"/>
  <rect x="1000" y="176" width="190" height="64" rx="12" class="ok"/>
  <text x="1024" y="202" class="h">个人资源库</text>
  <text x="1024" y="224" class="t">仅内容标签</text>
  <line x1="1190" y1="208" x2="1246" y2="208" class="arrow2"/>
  <rect x="1260" y="176" width="210" height="64" rx="12" class="ok"/>
  <text x="1284" y="202" class="h">按钮仍展示</text>
  <text x="1284" y="224" class="t">点击后只刷新内容标签</text>

  <rect x="48" y="300" width="1460" height="210" rx="18" class="lane"/>
  <text x="72" y="330" class="laneTitle">B. 集团/校本标签树与权限判断</text>
  <rect x="80" y="356" width="210" height="74" rx="12" class="card"/>
  <text x="104" y="384" class="h">拉取最新标签树</text>
  <text x="104" y="406" class="t">集团：科目知识点树</text>
  <text x="104" y="424" class="t">校本：学校 + 科目标签树</text>
  <line x1="290" y1="393" x2="346" y2="393" class="arrow"/>
  <path d="M420 350L510 393L420 436L330 393Z" class="decision"/>
  <text x="382" y="389" class="h">是否单权限？</text>
  <text x="382" y="411" class="t">可确定唯一标签树</text>
  <line x1="510" y1="393" x2="590" y2="358" class="arrow2"/>
  <text x="532" y="365" class="yes">是</text>
  <rect x="604" y="326" width="220" height="74" rx="12" class="ok"/>
  <text x="628" y="354" class="h">自动先打一次</text>
  <text x="628" y="376" class="t">打开弹窗后回填推荐标签</text>
  <text x="628" y="394" class="t">不强制 toast 打扰用户</text>
  <line x1="510" y1="393" x2="590" y2="448" class="arrow"/>
  <text x="532" y="438" class="no">否</text>
  <rect x="604" y="424" width="220" height="64" rx="12" class="card"/>
  <text x="628" y="450" class="h">等待用户点击按钮</text>
  <text x="628" y="472" class="t">AI智能打标按钮始终展示</text>
  <line x1="824" y1="363" x2="900" y2="406" class="arrow"/>
  <line x1="824" y1="456" x2="900" y2="406" class="arrow"/>
  <rect x="914" y="370" width="220" height="74" rx="12" class="blue"/>
  <text x="938" y="398" class="h">用户点击 AI智能打标</text>
  <text x="938" y="420" class="t">按当前范围/学校/科目打标</text>
  <text x="938" y="438" class="t">loading 中不可重复点击</text>
  <line x1="1134" y1="407" x2="1190" y2="407" class="arrow"/>
  <rect x="1204" y="370" width="240" height="74" rx="12" class="ok"/>
  <text x="1228" y="398" class="h">打标成功</text>
  <text x="1228" y="420" class="t">回填资源标签 + 内容标签</text>
  <text x="1228" y="438" class="t">主动点击时 toast 完成</text>
  <path d="M714 488C748 526 816 526 850 488" class="dash"/>
  <rect x="864" y="464" width="300" height="36" rx="10" class="card"/>
  <text x="884" y="487" class="s">P1 评估：上下文稳定 800-1500ms 后自动触发</text>

  <rect x="48" y="540" width="1460" height="230" rx="18" class="lane"/>
  <text x="72" y="570" class="laneTitle">C. 人工修改后再次打标</text>
  <rect x="80" y="608" width="230" height="74" rx="12" class="card"/>
  <text x="104" y="636" class="h">用户人工修改标签</text>
  <text x="104" y="658" class="t">新增、删除、修改任一标签</text>
  <text x="104" y="676" class="t">即标记为“已人工修改”</text>
  <line x1="310" y1="645" x2="366" y2="645" class="arrow"/>
  <path d="M450 600L545 645L450 690L355 645Z" class="decision"/>
  <text x="404" y="641" class="h">再次点击</text>
  <text x="394" y="663" class="t">AI智能打标？</text>
  <line x1="545" y1="645" x2="606" y2="645" class="arrow"/>
  <rect x="620" y="608" width="230" height="74" rx="12" class="warn"/>
  <text x="644" y="636" class="h">弹二次确认</text>
  <text x="644" y="658" class="t">重新打标会覆盖当前已选标签</text>
  <text x="644" y="676" class="t">确定继续吗？</text>
  <line x1="850" y1="645" x2="906" y2="612" class="arrow2"/>
  <text x="866" y="618" class="yes">重新打标</text>
  <rect x="920" y="576" width="230" height="74" rx="12" class="blue"/>
  <text x="944" y="604" class="h">保留旧标签并 loading</text>
  <text x="944" y="626" class="t">成功前不清空人工修改结果</text>
  <line x1="1150" y1="613" x2="1206" y2="613" class="arrow2"/>
  <rect x="1220" y="576" width="230" height="74" rx="12" class="ok"/>
  <text x="1244" y="604" class="h">成功后整体替换</text>
  <text x="1244" y="626" class="t">以新 AI 推荐结果覆盖旧标签</text>
  <line x1="850" y1="645" x2="906" y2="708" class="arrow"/>
  <text x="866" y="706" class="no">取消/失败</text>
  <rect x="920" y="682" width="230" height="64" rx="12" class="card"/>
  <text x="944" y="708" class="h">不覆盖当前标签</text>
  <text x="944" y="730" class="t">失败 toast：已保留当前标签</text>

  <rect x="48" y="800" width="1460" height="130" rx="18" class="lane"/>
  <text x="72" y="830" class="laneTitle">D. 源头标签失效与发布校验</text>
  <rect x="80" y="856" width="240" height="54" rx="12" class="card"/>
  <text x="104" y="879" class="h">打开/恢复标签结果</text>
  <text x="104" y="899" class="t">用最新标签树校验已选标签</text>
  <line x1="320" y1="883" x2="376" y2="883" class="arrow"/>
  <path d="M460 840L550 883L460 926L370 883Z" class="decision"/>
  <text x="414" y="879" class="h">源头是否存在？</text>
  <text x="424" y="899" class="t">iTeach 标签树</text>
  <line x1="550" y1="883" x2="620" y2="852" class="arrow2"/>
  <text x="574" y="858" class="yes">存在</text>
  <rect x="634" y="826" width="220" height="54" rx="12" class="ok"/>
  <text x="658" y="849" class="h">正常标签展示</text>
  <text x="658" y="869" class="t">允许发布</text>
  <line x1="550" y1="883" x2="620" y2="914" class="arrow"/>
  <text x="574" y="908" class="no">不存在</text>
  <rect x="634" y="894" width="220" height="54" rx="12" class="warn"/>
  <text x="658" y="917" class="h">置灰显示“已失效”</text>
  <text x="658" y="937" class="t">可删除，不可再次选中</text>
  <line x1="854" y1="921" x2="910" y2="921" class="arrow"/>
  <rect x="924" y="894" width="240" height="54" rx="12" class="warn"/>
  <text x="948" y="917" class="h">确认发布时阻断</text>
  <text x="948" y="937" class="t">toast：当前标签已失效...</text>
  <line x1="1164" y1="921" x2="1220" y2="885" class="dash"/>
  <rect x="1234" y="852" width="220" height="54" rx="12" class="blue"/>
  <text x="1258" y="875" class="h">重新 AI 打标</text>
  <text x="1258" y="895" class="t">按最新树替换失效标签</text>
</svg>
