<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>单词伪装者</title>
  <style>
    :root {
      --asset-bg-opacity: 1;
      --asset-toy-room-bg: url("https://aigc-material.xdf.cn/lingguang-aigc/material/chenjialing12/jiTR9pdn-2600008999-AigcImage-81fc81cdad964a8aa8491bcab492c886_0.png");
      --asset-letters-cat: url("https://aigc-material.xdf.cn/lingguang-aigc/material/chenjialing12/EDDZZs8l-2600008999-AigcImage-23e0120144e848d581ae71a010485a28_0.png");
      --asset-letters-dog: url("https://aigc-material.xdf.cn/lingguang-aigc/material/chenjialing12/cCWjRrtn-2600008999-AigcImage-3010d18dae46401fa4a6cf6ecd8f3a19_0.png");
      --asset-letters-sun: url("https://aigc-material.xdf.cn/lingguang-aigc/material/chenjialing12/M3dXiw3z-2600008999-AigcImage-0ca0f3d2ef864678aa75af56f9012de4_0.png");
      --asset-word-reward: url("https://aigc-material.xdf.cn/lingguang-aigc/material/chenjialing12/4Q0QAgR0-2600008999-AigcImage-e9001d7fc21048b0b28db67c183287d1_0.png");
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f7eeff; color: #243047; }
    body { display: grid; place-items: center; }
    .stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; background:
      radial-gradient(circle at 15% 13%, rgba(255,255,255,.9) 0 7%, transparent 7.6%),
      radial-gradient(circle at 80% 16%, rgba(255,255,255,.8) 0 8%, transparent 8.6%),
      linear-gradient(180deg, #d9efff 0%, #fff0c8 52%, #ffd3e3 100%); isolation: isolate; }
    .stage::before { content: ""; position: absolute; inset: 0; z-index: -2; background-image: var(--asset-toy-room-bg); background-size: cover; background-position: center; opacity: var(--asset-bg-opacity, 0); }
    .hud { position: absolute; left: 4%; right: 4%; top: 4%; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .title, .status { padding: 10px 15px; border-radius: 20px; background: rgba(255,255,255,.78); box-shadow: 0 16px 36px rgba(77,61,110,.13), inset 0 1px 0 #fff; font-weight: 1000; }
    .title { font-size: clamp(20px, 3.1vw, 38px); display: flex; gap: 10px; align-items: center; }
    .title span { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: #fff; background: linear-gradient(180deg,#a78bfa,#7c3aed); box-shadow: 0 7px 0 #5b21b6; }
    .status { font-size: clamp(13px, 1.7vw, 20px); color: #4b3c70; }
    .room { position: absolute; left: 4%; right: 4%; top: 16%; bottom: 9%; border-radius: 36px; overflow: hidden; background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.24)); border: 4px solid rgba(255,255,255,.62); box-shadow: inset 0 0 0 2px rgba(255,255,255,.4), 0 26px 70px rgba(76,59,112,.18); }
    .wall { position: absolute; inset: 0 0 28%; background:
      linear-gradient(90deg, rgba(255,255,255,.28) 1px, transparent 1px) 0 0 / 84px 84px,
      linear-gradient(180deg, rgba(255,255,255,.28) 1px, transparent 1px) 0 0 / 84px 84px;
      opacity: .75; }
    .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 31%; background: repeating-linear-gradient(90deg, #ffd5a6 0 74px, #ffc58a 75px 148px); box-shadow: inset 0 18px 0 rgba(255,255,255,.26); }
    .shelf { position: absolute; left: 8%; top: 18%; width: 28%; height: 7%; border-radius: 999px; background: linear-gradient(180deg, #ffcf8b, #e9944c); box-shadow: 0 13px 0 #b86b32; }
    .castle { position: absolute; right: 9%; top: 17%; width: 16%; height: 25%; border-radius: 22px 22px 8px 8px; background: linear-gradient(180deg,#c4b5fd,#8b5cf6); box-shadow: 0 16px 0 #6d28d9, 0 22px 30px rgba(80,50,120,.18); }
    .castle::before, .castle::after { content: ""; position: absolute; bottom: 82%; width: 32%; height: 46%; border-radius: 18px 18px 4px 4px; background: linear-gradient(180deg,#fff0f6,#fb7185); }
    .castle::before { left: 8%; } .castle::after { right: 8%; }
    .toy { position: absolute; border: 0; background: transparent; cursor: pointer; transition: transform .18s ease; filter: drop-shadow(0 15px 10px rgba(70,50,100,.12)); }
    .toy:hover { transform: translateY(-5px) scale(1.04); }
    .block { width: clamp(58px, 7vw, 92px); aspect-ratio: 1; border-radius: 20px; background: linear-gradient(180deg,#fff,#ffdf7e); box-shadow: 0 11px 0 #d9a53a; }
    .block::after { content: ""; position: absolute; left: 22%; right: 22%; top: 16%; height: 14%; border-radius: 999px; background: rgba(255,255,255,.65); }
    .carToy { width: clamp(92px, 11vw, 148px); height: clamp(54px, 6vw, 82px); border-radius: 28px 38px 18px 18px; background: linear-gradient(180deg,#79b7ff,#3b82f6); box-shadow: 0 10px 0 #1d4ed8; }
    .carToy::before, .carToy::after { content: ""; position: absolute; bottom: -12%; width: 22%; aspect-ratio: 1; border-radius: 50%; background: #1f2937; box-shadow: inset 0 0 0 6px #fff; }
    .carToy::before { left: 15%; } .carToy::after { right: 15%; }
    .gift { width: clamp(72px, 8vw, 110px); aspect-ratio: 1; border-radius: 18px; background: linear-gradient(90deg,#fb7185 0 42%,#fff 43% 57%,#fb7185 58%); box-shadow: 0 12px 0 #be3450; }
    .gift::after { content: ""; position: absolute; left: -5%; right: -5%; top: 38%; height: 18%; background: #fff; border-radius: 999px; }
    .plush { width: clamp(82px, 9vw, 122px); aspect-ratio: 1; border-radius: 50% 50% 45% 45%; background: radial-gradient(circle at 35% 38%,#fff 0 6%,transparent 6.6%), radial-gradient(circle at 64% 38%,#fff 0 6%,transparent 6.6%), linear-gradient(180deg,#f9a8d4,#ec4899); box-shadow: 0 14px 0 #be185d; }
    .letter { position: absolute; z-index: 8; border: 0; cursor: pointer; display: grid; place-items: center; width: clamp(58px, 7vw, 92px); height: clamp(58px, 7vw, 92px); border-radius: 24px; background: linear-gradient(180deg,#fff,#f0dcff); box-shadow: 0 11px 0 #c7a2ea, 0 18px 22px rgba(70,45,110,.15); color: #6d3d9a; font-size: clamp(25px, 4vw, 52px); font-weight: 1000; transform: rotate(var(--r)); transition: .18s ease; }
    .assets-ready .letter { background-image: var(--asset-letter-set), linear-gradient(180deg,#fff,#f0dcff); background-size: 330% 100%, 100% 100%; background-position: var(--asset-letter-pos, center) center, center; background-repeat: no-repeat; color: rgba(109,61,154,.86); text-shadow: 0 2px 0 rgba(255,255,255,.72); }
    .letter[data-word="CAT"] { --asset-letter-set: var(--asset-letters-cat); }
    .letter[data-word="DOG"] { --asset-letter-set: var(--asset-letters-dog); }
    .letter[data-word="SUN"] { --asset-letter-set: var(--asset-letters-sun); }
    .letter[data-letter="C"], .letter[data-letter="D"], .letter[data-letter="S"] { --asset-letter-pos: left; }
    .letter[data-letter="A"], .letter[data-letter="O"], .letter[data-letter="U"] { --asset-letter-pos: center; }
    .letter[data-letter="T"], .letter[data-letter="G"], .letter[data-letter="N"] { --asset-letter-pos: right; }
    .letter:hover { transform: translateY(-5px) rotate(var(--r)) scale(1.04); }
    .letter.found { background: linear-gradient(180deg,#eefff2,#93ffb3); color: #176b3b; box-shadow: 0 11px 0 #4cc66f; }
    .letter.wrong { animation: shake .35s ease; }
    .target { position: absolute; left: 50%; bottom: 2.6%; transform: translateX(-50%); z-index: 11; display: flex; align-items: center; gap: 9px; padding: 10px 14px; border-radius: 999px; background: rgba(255,255,255,.84); box-shadow: 0 14px 30px rgba(73,50,110,.14); font-size: clamp(14px, 2vw, 24px); font-weight: 1000; }
    .word { padding: 5px 10px; border-radius: 999px; background: #f0e5ff; color: #7244a8; }
    .word.done { background: #d9ffe4; color: #16844a; text-decoration: line-through; }
    .tip { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.8); z-index: 15; padding: 10px 18px; border-radius: 999px; background: #fff; color: #16844a; font-size: clamp(20px, 3.2vw, 40px); font-weight: 1000; opacity: 0; box-shadow: 0 22px 48px rgba(65,50,90,.18); pointer-events: none; }
    .tip.show { animation: pop .8s ease both; }
    .summary { position: absolute; inset: 0; z-index: 20; display: none; place-items: center; background: rgba(246,238,255,.72); backdrop-filter: blur(6px); }
    .summary::before { content: ""; position: absolute; inset: 7% 8% auto; height: 34%; background-image: var(--asset-word-reward); background-size: contain; background-repeat: no-repeat; background-position: center; pointer-events: none; opacity: .96; }
    .summary.show { display: grid; }
    .panel { position: relative; width: min(70%, 700px); padding: 30px; border-radius: 34px; background: rgba(255,255,255,.94); text-align: center; box-shadow: 0 34px 90px rgba(68,50,105,.22); border: 4px solid #fff; }
    .panel h2 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 58px); color: #56318b; }
    .panel button { border: 0; border-radius: 999px; padding: 12px 20px; background: #8b5cf6; color: #fff; font-weight: 1000; cursor: pointer; }
    .asset-note { display: none; }
    @keyframes shake { 20%{ transform: translateX(-8px) rotate(var(--r)); } 40%{ transform: translateX(8px) rotate(var(--r)); } 60%{ transform: translateX(-5px) rotate(var(--r)); } 80%{ transform: translateX(5px) rotate(var(--r)); } }
    @keyframes pop { 0%{opacity:0; transform:translate(-50%,-50%) scale(.7)} 28%{opacity:1; transform:translate(-50%,-50%) scale(1.08)} 100%{opacity:0; transform:translate(-50%,-72%) scale(1)} }
  </style>
</head>
<body>
  <main class="stage assets-ready" data-source-md="003_单词伪装者_英语捉迷藏_蛋仔风_6-10岁.md">
    <div class="hud"><div class="title"><span>ABC</span>单词伪装者</div><div class="status">时间 <b id="time">60</b>s · 找到 <b id="count">0</b>/3</div></div>
    <section class="room">
      <div class="wall"></div><div class="floor"></div><div class="shelf"></div><div class="castle"></div>
      <button class="toy block" style="left:11%;top:20%"></button>
      <button class="toy carToy" style="left:63%;top:20%"></button>
      <button class="toy gift" style="left:51%;top:54%"></button>
      <button class="toy plush" style="left:16%;top:56%"></button>
      <button class="letter" data-word="CAT" data-letter="C" style="left:25%;top:27%;--r:-8deg">C</button>
      <button class="letter" data-word="CAT" data-letter="A" style="left:42%;top:39%;--r:6deg">A</button>
      <button class="letter" data-word="CAT" data-letter="T" style="left:68%;top:31%;--r:-5deg">T</button>
      <button class="letter" data-word="DOG" data-letter="D" style="left:30%;top:65%;--r:5deg">D</button>
      <button class="letter" data-word="DOG" data-letter="O" style="left:50%;top:19%;--r:-4deg">O</button>
      <button class="letter" data-word="DOG" data-letter="G" style="left:78%;top:58%;--r:8deg">G</button>
      <button class="letter" data-word="SUN" data-letter="S" style="left:10%;top:39%;--r:9deg">S</button>
      <button class="letter" data-word="SUN" data-letter="U" style="left:36%;top:15%;--r:-7deg">U</button>
      <button class="letter" data-word="SUN" data-letter="N" style="left:84%;top:38%;--r:4deg">N</button>
    </section>
    <div class="target">找到单词：<span class="word" id="CAT">CAT</span><span class="word" id="DOG">DOG</span><span class="word" id="SUN">SUN</span></div>
    <div class="tip" id="tip">找到了一个字母！</div>
    <div class="summary" id="summary"><div class="panel"><h2>全部找到了！</h2><p id="result">CAT、DOG、SUN 都被你发现啦</p><button onclick="location.reload()">再找一次</button></div></div>
    <div class="asset-note">图片占位：玩具王国背景 / 伪装字母素材 / 奖励贴纸，可按资产清单替换</div>
  </main>
  <script>
    const found = { CAT: new Set(), DOG: new Set(), SUN: new Set() };
    let done = 0, time = 60, mistakes = 0;
    const tip = document.getElementById('tip');
    function say(text, good) { tip.textContent = text; tip.style.color = good ? '#16844a' : '#f97316'; tip.classList.remove('show'); void tip.offsetWidth; tip.classList.add('show'); }
    document.querySelectorAll('.letter').forEach(btn => btn.addEventListener('click', () => { const w = btn.dataset.word, l = btn.dataset.letter; if (btn.classList.contains('found')) return; btn.classList.add('found'); found[w].add(l); say(`发现 ${w} 里的 ${l}`, true); if (found[w].size === 3 && !document.getElementById(w).classList.contains('done')) { document.getElementById(w).classList.add('done'); done++; say(`${w} 找齐了！`, true); } document.getElementById('count').textContent = done; if (done === 3) finish(); }));
    document.querySelectorAll('.toy').forEach(btn => btn.addEventListener('click', () => { mistakes++; btn.classList.add('wrong'); say('这里没有目标字母', false); setTimeout(() => btn.classList.remove('wrong'), 380); }));
    const timer = setInterval(() => { time--; document.getElementById('time').textContent = time; if (time <= 0) finish(); }, 1000);
    function finish() { clearInterval(timer); document.getElementById('result').textContent = `找到 ${done}/3 个单词 · 失误 ${mistakes} 次 · 星级：${done === 3 && mistakes === 0 ? '⭐⭐⭐' : done >= 2 ? '⭐⭐' : '⭐'}`; document.getElementById('summary').classList.add('show'); }
  </script>
</body>
</html>
