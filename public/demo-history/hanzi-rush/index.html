<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>汉字拼图Rush - 汉字结构拼装</title>
    <style>
      :root {
        --pink: #f07aa2;
        --pink-soft: #ffd7e3;
        --yellow: #ffd93d;
        --mint: #52c41a;
        --orange: #ffb800;
        --red: #ff4f5f;
        --blue: #4fc3f7;
        --purple: #4f568f;
        --ink: #38406c;
        --gray: #666666;
        --paper: #fff8e7;
        --line: rgba(56, 64, 108, 0.14);
        font-family: "Baloo 2", "Nunito", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        color: var(--ink);
        background: #000;
        user-select: none;
      }

      button {
        border: 0;
        font: inherit;
        cursor: pointer;
      }

      [hidden] {
        display: none !important;
      }

      .shell {
        position: relative;
        width: min(100vw, 177.78vh);
        aspect-ratio: 16 / 9;
        margin: auto;
        top: 50%;
        transform: translateY(-50%);
        overflow: hidden;
        background:
          url("./assets/07_hanzi_game_board_bg.webp") center / cover no-repeat,
          var(--paper);
        box-shadow: none;
      }

      .shell::before {
        content: none;
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.38), transparent 18%, transparent 82%, rgba(255, 255, 255, 0.38)),
          linear-gradient(180deg, rgba(255, 255, 255, 0.44), transparent 30%, rgba(255, 248, 231, 0.34));
        pointer-events: none;
      }

      .cloud {
        display: none;
        position: absolute;
        width: 12%;
        height: 5.4%;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        filter: blur(0.2px);
        box-shadow:
          2.2vw -1vw 0 rgba(255, 255, 255, 0.54),
          4.4vw 0.1vw 0 rgba(255, 255, 255, 0.42);
        opacity: 0.8;
        animation: cloudFloat 9s ease-in-out infinite;
      }

      .cloud.one {
        left: 4%;
        top: 11%;
      }

      .cloud.two {
        right: 12%;
        bottom: 11%;
        transform: scale(0.76);
        animation-delay: -3s;
      }

      .main-card {
        position: absolute;
        inset: 10.2% 8.8% 10.8% 12%;
        z-index: 2;
        border-radius: 28px;
        background: transparent;
        border: 0;
        box-shadow: none;
        display: grid;
        grid-template-rows: 11.5% minmax(0, 1fr) 14%;
        overflow: visible;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto minmax(300px, 1.25fr);
        align-items: center;
        gap: 14px;
        padding: 0 1.2%;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 2.25vw, 34px);
        line-height: 1;
        color: #f0a324;
        text-shadow: 0 3px 0 rgba(255, 255, 255, 0.78), 0 10px 22px rgba(240, 163, 36, 0.18);
        letter-spacing: 0;
        white-space: nowrap;
      }

      .timer {
        width: clamp(48px, 4.2vw, 66px);
        height: clamp(48px, 4.2vw, 66px);
        border-radius: 999px;
        display: grid;
        place-items: center;
        font-size: clamp(23px, 2.15vw, 32px);
        font-weight: 1000;
        color: white;
        background:
          radial-gradient(circle at 32% 20%, rgba(255, 255, 255, 0.88), transparent 26%),
          url("./assets/07_hanzi_timer_badge.webp") center / contain no-repeat,
          var(--orange);
        box-shadow:
          0 8px 16px rgba(255, 184, 0, 0.2),
          inset 0 -5px 0 rgba(207, 105, 0, 0.1);
      }

      .timer.danger {
        background:
          radial-gradient(circle at 32% 20%, rgba(255, 255, 255, 0.86), transparent 26%),
          var(--red);
        animation: heartbeat 0.64s ease-in-out infinite;
      }

      .score-strip {
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .pill {
        min-width: 92px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(79, 195, 247, 0.26);
        color: var(--purple);
        font-weight: 900;
        font-size: clamp(11px, 0.9vw, 14px);
        text-align: center;
        box-shadow: 0 8px 18px rgba(56, 64, 108, 0.08), inset 0 2px 0 rgba(255, 255, 255, 0.88);
        white-space: nowrap;
      }

      .game-body {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 40%) minmax(0, 60%);
        min-height: 0;
        padding: 0.2% 1.4% 1%;
        gap: 2.4%;
      }

      .target-panel,
      .parts-panel {
        min-height: 0;
        border-radius: 24px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.3));
        border: 2px solid rgba(116, 183, 224, 0.38);
        box-shadow:
          0 10px 24px rgba(56, 64, 108, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.68);
      }

      .target-panel {
        position: relative;
        padding: 8px 14px 6px;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 5px;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 0;
        font-size: clamp(16px, 1.32vw, 21px);
        color: #3e4779;
        font-weight: 1000;
      }

      .hint {
        color: rgba(62, 71, 121, 0.68);
        font-size: clamp(12px, 0.95vw, 15px);
        font-weight: 800;
      }

      .target-stage {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 0;
      }

      .outline-box {
        position: relative;
        width: min(98%, 410px);
        aspect-ratio: 1.62 / 1;
        border-radius: 26px;
        border: 2px dashed rgba(82, 196, 26, 0.5);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.46), rgba(255, 248, 231, 0.28));
        box-shadow:
          inset 0 0 0 6px rgba(255, 255, 255, 0.24),
          0 10px 22px rgba(56, 64, 108, 0.08);
        overflow: hidden;
      }

      .outline-box.layout-lcr {
        width: min(100%, 456px);
        aspect-ratio: 2 / 1;
      }

      .outline-box.layout-lr {
        width: min(100%, 448px);
        aspect-ratio: 1.9 / 1;
      }

      .outline-box.layout-tb {
        width: min(78%, 300px);
        aspect-ratio: 1 / 1.1;
      }

      .outline-box.layout-tripod {
        width: min(86%, 330px);
        aspect-ratio: 1.08 / 1;
      }

      .ghost-char {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: rgba(62, 71, 121, 0.09);
        font-size: clamp(118px, 10vw, 172px);
        font-family: "STKaiti", "KaiTi", "Songti SC", serif;
        font-weight: 900;
        line-height: 1;
      }

      .outline-box.layout-lcr .ghost-char {
        display: none;
      }

      .outline-box.layout-lr .ghost-char {
        color: rgba(62, 71, 121, 0.055);
        font-size: clamp(92px, 7.8vw, 138px);
      }

      .slots {
        position: absolute;
        inset: 8% 7%;
        display: grid;
        gap: 12px;
      }

      .slots.layout-lr {
        inset: 13% 9%;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 24px;
      }

      .slots.layout-lr .slot {
        border-radius: 18px;
      }

      .slots.layout-tb {
        grid-template-rows: 1fr 1fr;
      }

      .slots.layout-lcr {
        inset: 13% 8%;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .slots.layout-lcr .slot {
        border-radius: 18px;
      }

      .slots.layout-tripod {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
      }

      .slots.layout-tripod .slot:nth-child(1) {
        grid-column: 1 / 3;
        width: 50%;
        justify-self: center;
      }

      .slots.layout-complex {
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 0.78fr 0.78fr 1fr;
      }

      .slots.layout-complex .slot:nth-child(1),
      .slots.layout-complex .slot:nth-child(2) {
        grid-column: 1 / 4;
        width: 45%;
        justify-self: center;
      }

      .slot {
        position: relative;
        display: grid;
        place-items: center;
        min-width: 0;
        min-height: 0;
        border-radius: 20px;
        border: 2px dashed rgba(79, 195, 247, 0.34);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(230, 243, 255, 0.34));
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }

      .slot::after {
        content: attr(data-label);
        position: absolute;
        left: 12px;
        top: 8px;
        color: rgba(62, 71, 121, 0.42);
        font-size: clamp(10px, 0.78vw, 12px);
        font-weight: 900;
      }

      .slot.hover {
        transform: scale(1.03);
        border-color: var(--orange);
        background: rgba(255, 217, 61, 0.22);
      }

      .slot.filled {
        border-style: solid;
        border-color: rgba(82, 196, 26, 0.62);
        background: rgba(82, 196, 26, 0.12);
      }

      .placed-piece {
        touch-action: none;
        cursor: grab;
        width: min(66%, 88px);
        aspect-ratio: 1;
        border-radius: 18px;
        display: grid;
        place-items: center;
        font-size: clamp(30px, 3.3vw, 54px);
        color: #40477a;
        font-family: "STKaiti", "KaiTi", "Songti SC", serif;
        font-weight: 1000;
        background:
          radial-gradient(circle at 30% 18%, rgba(255, 255, 255, 0.92), transparent 32%),
          url("./assets/07_hanzi_piece_tile_ref.webp") center / cover no-repeat,
          var(--piece-color, #ffd1dc);
        box-shadow:
          0 7px 0 rgba(56, 64, 108, 0.1),
          0 12px 18px rgba(56, 64, 108, 0.12),
          inset 0 -5px 0 rgba(56, 64, 108, 0.06);
      }

      .target-char {
        margin: 0 auto;
        min-height: 36px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        color: #465083;
        font-size: clamp(15px, 1.18vw, 19px);
        font-weight: 900;
        line-height: 1.1;
      }

      .target-char strong {
        font-family: "STKaiti", "KaiTi", "Songti SC", serif;
        font-size: clamp(36px, 3.8vw, 60px);
        line-height: 0.9;
      }

      .parts-panel {
        position: relative;
        padding: 8px 14px 6px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 7px;
      }

      .rules {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      .rule-chip {
        min-width: 0;
        display: grid;
        place-items: center;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: clamp(10px, 0.86vw, 13px);
        font-weight: 900;
        color: rgba(62, 71, 121, 0.78);
        background: rgba(230, 243, 255, 0.68);
        border: 1px solid rgba(79, 195, 247, 0.16);
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .parts-grid {
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        align-content: center;
        gap: 16px;
        padding: 1.2% 2.2%;
      }

      .piece {
        touch-action: none;
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        min-height: 78px;
        max-height: 132px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        color: #424a7d;
        font-family: "STKaiti", "KaiTi", "Songti SC", serif;
        font-size: clamp(42px, 4.25vw, 72px);
        font-weight: 1000;
        background:
          radial-gradient(circle at 28% 18%, rgba(255, 255, 255, 0.78), transparent 30%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(107, 91, 149, 0.08)),
          url("./assets/07_hanzi_piece_tile_ref.webp") center / cover no-repeat,
          var(--piece-color);
        box-shadow:
          0 8px 0 rgba(56, 64, 108, 0.11),
          0 16px 22px rgba(56, 64, 108, 0.13),
          inset 0 -6px 0 rgba(56, 64, 108, 0.07);
        transition: transform 0.18s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.18s ease;
      }

      .piece:hover,
      .piece.selected {
        transform: translateY(-5px) scale(1.05);
      }

      .piece.selected {
        outline: 4px solid rgba(255, 184, 0, 0.42);
        outline-offset: 4px;
      }

      .piece.used {
        opacity: 0.22;
        pointer-events: none;
        transform: scale(0.92);
      }

      .piece.dragging {
        position: fixed;
        z-index: 60;
        width: clamp(82px, 7vw, 124px);
        pointer-events: none;
        transform: translate(-50%, -50%) scale(1.08) rotate(4deg);
      }

      .dragging {
        position: fixed;
        z-index: 60;
        width: clamp(82px, 7vw, 124px);
        pointer-events: none;
        transform: translate(-50%, -50%) scale(1.08) rotate(4deg);
      }

      .feedback {
        position: relative;
        min-height: 38px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        color: #3f477a;
        font-size: clamp(16px, 1.28vw, 21px);
        font-weight: 1000;
        background:
          linear-gradient(90deg, rgba(255, 217, 61, 0.34), rgba(230, 255, 230, 0.5));
        border: 1px solid rgba(82, 196, 26, 0.18);
        overflow: hidden;
      }

      .feedback::before {
        content: "";
        position: absolute;
        inset: -110% 24% -80%;
        opacity: 0;
        pointer-events: none;
        background: center / contain no-repeat;
      }

      .feedback.good::before {
        opacity: 0.36;
        background-image: url("./assets/07_hanzi_success_burst.png");
      }

      .feedback.bad::before {
        opacity: 0.32;
        background-image: url("./assets/07_hanzi_error_puff.webp");
      }

      .feedback > span {
        position: relative;
        z-index: 1;
      }

      .feedback {
        isolation: isolate;
      }

      .feedback.good {
        background: rgba(230, 255, 230, 0.66);
        animation: glow 0.85s ease-in-out 2;
      }

      .feedback.bad {
        background: rgba(255, 230, 210, 0.66);
      }

      .bottombar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 1.1% 2.6% 2.1%;
        transform: none;
      }

      .btn {
        position: relative;
        height: clamp(40px, 3.45vw, 50px);
        min-width: clamp(132px, 10.6vw, 178px);
        padding: 0 24px;
        border-radius: 999px;
        color: #414a7c;
        font-weight: 1000;
        font-size: clamp(16px, 1.26vw, 21px);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.72);
        box-shadow:
          0 7px 0 var(--btn-shadow, rgba(56, 64, 108, 0.14)),
          0 14px 22px rgba(56, 64, 108, 0.12),
          inset 0 2px 0 rgba(255, 255, 255, 0.82),
          inset 0 -3px 0 rgba(56, 64, 108, 0.06);
        transition: transform 0.22s cubic-bezier(0.68, -0.55, 0.265, 1.55), filter 0.18s ease;
        overflow: hidden;
      }

      .btn::before {
        content: "";
        position: absolute;
        inset: 5px 18px auto;
        height: 34%;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0));
        pointer-events: none;
      }

      .btn::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        border: 1px solid rgba(255, 255, 255, 0.5);
        pointer-events: none;
      }

      .btn:hover {
        transform: translateY(-2px) scale(1.04);
        filter: saturate(1.06);
      }

      .btn:active {
        transform: translateY(4px) scale(0.98);
        box-shadow:
          0 3px 0 var(--btn-shadow, rgba(56, 64, 108, 0.14)),
          0 8px 16px rgba(56, 64, 108, 0.12),
          inset 0 2px 0 rgba(255, 255, 255, 0.76);
      }

      .btn.start,
      .btn.next {
        --btn-shadow: rgba(207, 93, 135, 0.28);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0)),
          linear-gradient(135deg, #ff9fc0, #ffd3e1);
      }

      .btn.submit {
        --btn-shadow: rgba(50, 159, 95, 0.28);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0)),
          linear-gradient(135deg, #49d98a, #a8f3c3);
        color: #2f4574;
      }

      .btn.reset {
        --btn-shadow: rgba(207, 165, 33, 0.3);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0)),
          linear-gradient(135deg, #fff07c, #ffd93d);
        color: #4b4f79;
      }

      .overlay {
        position: absolute;
        inset: 0;
        z-index: 90;
        display: grid;
        place-items: center;
        background: rgba(48, 65, 92, 0.34);
        backdrop-filter: blur(3px);
      }

      #startOverlay {
        cursor: pointer;
        background:
          url("./assets/07_hanzi_cover.webp") center / cover no-repeat,
          url("./assets/07_hanzi_puzzle_bg.webp") center / cover no-repeat,
          #fff8e7;
        backdrop-filter: none;
      }

      .start-card,
      .result-card {
        width: min(700px, 68%);
        border-radius: 38px;
        padding: 34px 46px 40px;
        text-align: center;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 217, 61, 0.26), transparent 30%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 248, 231, 0.9));
        border: 2px solid rgba(255, 255, 255, 0.92);
        box-shadow:
          0 26px 70px rgba(56, 64, 108, 0.18),
          0 0 0 8px rgba(255, 255, 255, 0.28),
          inset 0 2px 0 rgba(255, 255, 255, 0.9);
      }

      .result-card {
        position: relative;
        overflow: hidden;
        width: min(620px, 52%);
        padding: 30px 40px 36px;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 217, 61, 0.22), transparent 34%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 248, 231, 0.94));
        border-color: rgba(255, 255, 255, 0.95);
        box-shadow:
          0 24px 64px rgba(36, 50, 82, 0.28),
          0 0 0 8px rgba(255, 255, 255, 0.24),
          inset 0 2px 0 rgba(255, 255, 255, 0.92);
      }

      .result-card::before {
        content: "";
        position: absolute;
        inset: -40% 8% auto;
        height: 72%;
        opacity: 0.46;
        background: url("./assets/07_hanzi_success_burst.png") center / contain no-repeat;
        pointer-events: none;
      }

      .mascot {
        position: relative;
        z-index: 1;
        width: min(148px, 16vw);
        aspect-ratio: 1;
        margin: 0 auto 14px;
        background:
          url("./assets/07_hanzi_egg_mascot.webp") center / contain no-repeat,
          radial-gradient(circle at 34% 26%, #ffffff 0 9%, transparent 10%),
          linear-gradient(145deg, #ffd1dc, #fff44f);
        border-radius: 46% 54% 48% 52%;
        box-shadow:
          inset 0 -12px 0 rgba(107, 91, 149, 0.08),
          0 15px 28px rgba(107, 91, 149, 0.18);
        animation: mascotBounce 2.3s ease-in-out infinite;
      }

      .start-card h2,
      .result-card h2 {
        position: relative;
        z-index: 1;
        margin: 0 0 12px;
        color: #f07aa2;
        font-size: clamp(34px, 3.6vw, 56px);
        line-height: 1.05;
        text-shadow: 0 4px 0 white;
      }

      .start-card p,
      .result-card p {
        position: relative;
        z-index: 1;
        margin: 8px 0 22px;
        color: rgba(62, 71, 121, 0.82);
        font-size: clamp(17px, 1.38vw, 22px);
        font-weight: 900;
        line-height: 1.45;
      }

      .result-card .btn {
        position: relative;
        z-index: 1;
      }

      .shake {
        animation: shake 0.36s ease-in-out;
      }

      .celebrate .outline-box {
        animation: glow 0.68s ease-in-out 3;
      }

      .celebrate .placed-piece {
        animation: pop 0.62s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }

      .confetti {
        position: absolute;
        width: 14px;
        height: 20px;
        border-radius: 5px;
        top: 17%;
        left: 50%;
        z-index: 85;
        pointer-events: none;
        background: var(--c);
        animation: confetti 1s ease-out forwards;
      }

      @keyframes cloudFloat {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(18px);
        }
      }

      @keyframes heartbeat {
        0%,
        100% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.13);
        }
      }

      @keyframes glow {
        0%,
        100% {
          box-shadow: 0 14px 34px rgba(107, 91, 149, 0.14);
        }
        50% {
          box-shadow: 0 0 0 8px rgba(152, 255, 152, 0.48), 0 0 30px rgba(152, 255, 152, 0.88);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-12px);
        }
        40% {
          transform: translateX(10px);
        }
        60% {
          transform: translateX(-7px);
        }
        80% {
          transform: translateX(5px);
        }
      }

      @keyframes pop {
        0% {
          transform: scale(0.92);
        }
        50% {
          transform: scale(1.18) rotate(-4deg);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes mascotBounce {
        0%,
        100% {
          transform: translateY(0) rotate(-1deg);
        }
        50% {
          transform: translateY(-12px) rotate(2deg);
        }
      }

      @keyframes confetti {
        0% {
          transform: translate(-50%, 0) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translate(calc(-50% + var(--x)), var(--y)) rotate(360deg);
          opacity: 0;
        }
      }

      @media (max-width: 900px) {
        .main-card {
          inset: 10.8% 8.4% 11.2% 12.4%;
          grid-template-rows: 11.5% minmax(0, 1fr) 15%;
        }

        .topbar {
          gap: 8px;
          grid-template-columns: minmax(150px, 1fr) auto minmax(230px, 1.1fr);
        }

        h1 {
          font-size: clamp(19px, 2.3vw, 24px);
        }

        .timer {
          width: clamp(42px, 4.4vw, 50px);
          height: clamp(42px, 4.4vw, 50px);
          font-size: clamp(20px, 2.4vw, 24px);
        }

        .game-body {
          gap: 1.8%;
          padding-bottom: 1.6%;
        }

        .bottombar {
          transform: none;
          padding: 1.1% 2.6% 2.8%;
        }

        .parts-grid {
          gap: 8px;
          padding: 0.8% 2%;
        }

        .piece {
          min-height: 52px;
          border-radius: 18px;
          font-size: clamp(32px, 3.8vw, 44px);
        }

        .target-panel,
        .parts-panel {
          border-radius: 20px;
        }

        .target-panel {
          padding: 7px 12px 5px;
        }

        .parts-panel {
          padding: 7px 12px 5px;
          gap: 6px;
        }

        .target-char {
          min-height: 32px;
          gap: 7px;
        }

        .target-char strong {
          font-size: clamp(34px, 3.7vw, 46px);
        }

        .feedback {
          min-height: 34px;
          font-size: clamp(14px, 1.2vw, 17px);
        }

        .rule-chip {
          padding: 6px 8px;
        }

        .score-strip {
          gap: 5px;
        }

        .pill {
          min-width: 72px;
          padding: 4px 7px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell" aria-label="汉字拼图Rush互动课件">
      <div class="cloud one"></div>
      <div class="cloud two"></div>

      <section class="main-card" id="gameCard">
        <header class="topbar">
          <h1>汉字拼图Rush</h1>
          <div class="timer" id="timer">60</div>
          <div class="score-strip" aria-label="游戏状态">
            <div class="pill" id="questionIndex">第 1/5 题</div>
            <div class="pill" id="score">得分 0</div>
            <div class="pill" id="combo">连击 x1.0</div>
          </div>
        </header>

        <section class="game-body" aria-label="答题区">
          <article class="target-panel" id="targetPanel">
            <h2 class="section-title">
              <span>目标汉字</span>
              <span class="hint" id="structureText">左右结构</span>
            </h2>
            <div class="target-stage">
              <div class="outline-box" id="outlineBox">
                <div class="ghost-char" id="ghostChar">明</div>
                <div class="slots layout-lr" id="slots"></div>
              </div>
            </div>
            <div class="target-char">
              <span>拼出</span>
              <strong id="targetChar">明</strong>
              <span id="questionHint">由'日'和'月'组成</span>
            </div>
          </article>

          <article class="parts-panel">
            <h2 class="section-title">
              <span>部件池</span>
              <span class="hint">拖拽或点击放入，误放可取回</span>
            </h2>
            <div class="parts-grid" id="partsGrid" aria-label="偏旁部首碎片"></div>
            <div class="feedback" id="feedback">点击“开始挑战”后开始计时</div>
            <div class="rules" aria-label="规则说明">
              <div class="rule-chip">观察结构</div>
              <div class="rule-chip">拖拽拼装</div>
              <div class="rule-chip">正确 +5 秒</div>
              <div class="rule-chip">限时 60 秒</div>
            </div>
          </article>
        </section>

        <footer class="bottombar">
          <button class="btn start" id="startBtn">开始挑战</button>
          <button class="btn reset" id="resetBtn">重新摆放</button>
          <button class="btn next" id="nextBtn" hidden>下一题 →</button>
        </footer>
      </section>

      <section class="overlay" id="startOverlay" aria-label="汉字拼图Rush封面，点击任意位置开始"></section>

      <section class="overlay" id="resultOverlay" hidden>
        <div class="result-card">
          <div class="mascot" aria-hidden="true"></div>
          <h2 id="resultTitle">挑战完成</h2>
          <p id="resultText">本次得分 0，答对 0 题。</p>
          <button class="btn start" id="restartBtn">再玩一次</button>
        </div>
      </section>
    </main>

    <script>
      const questions = [
        {
          target: "明",
          voice: "q1",
          structure: "左右结构",
          layout: "layout-lr",
          slots: ["左偏旁", "右偏旁"],
          answer: ["日", "月"],
          pieces: ["日", "月", "目", "田"],
          hint: "由'日'和'月'组成"
        },
        {
          target: "好",
          voice: "q2",
          structure: "左右结构",
          layout: "layout-lr",
          slots: ["左偏旁", "右偏旁"],
          answer: ["女", "子"],
          pieces: ["女", "子", "妈", "了"],
          hint: "女字旁加子"
        },
        {
          target: "森",
          voice: "q3",
          structure: "品字结构",
          layout: "layout-tripod",
          slots: ["上方", "左下", "右下"],
          answer: ["木", "木", "木"],
          pieces: ["木", "木", "木", "林", "树"],
          hint: "三木成森"
        },
        {
          target: "尖",
          voice: "q4",
          structure: "上下结构",
          layout: "layout-tb",
          slots: ["上方", "下方"],
          answer: ["小", "大"],
          pieces: ["小", "大", "少", "太"],
          hint: "上小下大"
        },
        {
          target: "湖",
          voice: "q5",
          structure: "左中右结构",
          layout: "layout-lcr",
          slots: ["左边", "中间", "右边"],
          answer: ["氵", "古", "月"],
          pieces: ["氵", "古", "月", "胡", "沽"],
          hint: "三点水、古、月组成"
        }
      ];

      const colors = ["#ffd1dc", "#fff44f", "#98ff98", "#7edbff", "#cab7ff", "#ffc66d", "#ffb7c5"];
      const state = {
        current: 0,
        time: 60,
        score: 0,
        correct: 0,
        combo: 1,
        running: false,
        solved: false,
        selectedPiece: null,
        dragging: null,
        timerId: null,
        placements: []
      };

      const sound = {
        ctx: null,
        warnedTimes: new Set(),
        voice: null,
        voiceFiles: {
          welcome: "./assets/audio/vo_welcome.mp3",
          q1: "./assets/audio/vo_q1.mp3",
          q2: "./assets/audio/vo_q2.mp3",
          q3: "./assets/audio/vo_q3.mp3",
          q4: "./assets/audio/vo_q4.mp3",
          q5: "./assets/audio/vo_q5.mp3",
          correct: "./assets/audio/vo_correct.mp3",
          wrong: "./assets/audio/vo_wrong.mp3",
          return: "./assets/audio/vo_return.mp3",
          finish: "./assets/audio/vo_finish.mp3",
          timeout: "./assets/audio/vo_timeout.mp3"
        },
        ensure() {
          if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (this.ctx.state === "suspended") this.ctx.resume();
        },
        tone(freq, start, duration, type = "sine", gain = 0.045) {
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const amp = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + start);
          amp.gain.setValueAtTime(0.0001, this.ctx.currentTime + start);
          amp.gain.exponentialRampToValueAtTime(gain, this.ctx.currentTime + start + 0.018);
          amp.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + start + duration);
          osc.connect(amp).connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + start);
          osc.stop(this.ctx.currentTime + start + duration + 0.02);
        },
        noise(start, duration, gain = 0.025) {
          if (!this.ctx) return;
          const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * duration, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < data.length; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
          const source = this.ctx.createBufferSource();
          const amp = this.ctx.createGain();
          source.buffer = buffer;
          amp.gain.setValueAtTime(gain, this.ctx.currentTime + start);
          amp.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + start + duration);
          source.connect(amp).connect(this.ctx.destination);
          source.start(this.ctx.currentTime + start);
        },
        play(name) {
          this.ensure();
          if (name === "start") {
            this.tone(523, 0, 0.08, "sine", 0.035);
            this.tone(784, 0.08, 0.12, "sine", 0.04);
          } else if (name === "select") {
            this.tone(620, 0, 0.045, "triangle", 0.024);
          } else if (name === "place") {
            this.tone(440, 0, 0.055, "triangle", 0.032);
            this.tone(660, 0.045, 0.075, "triangle", 0.034);
          } else if (name === "return") {
            this.tone(520, 0, 0.05, "triangle", 0.026);
            this.tone(360, 0.045, 0.08, "triangle", 0.026);
          } else if (name === "correct") {
            this.tone(523, 0, 0.09, "sine", 0.04);
            this.tone(659, 0.08, 0.09, "sine", 0.045);
            this.tone(880, 0.16, 0.16, "sine", 0.05);
            this.noise(0.03, 0.18, 0.014);
          } else if (name === "wrong") {
            this.tone(220, 0, 0.09, "sawtooth", 0.025);
            this.tone(165, 0.08, 0.12, "sawtooth", 0.022);
          } else if (name === "tick") {
            this.tone(760, 0, 0.045, "square", 0.018);
          } else if (name === "finish") {
            this.tone(392, 0, 0.1, "sine", 0.035);
            this.tone(523, 0.1, 0.12, "sine", 0.04);
            this.tone(659, 0.22, 0.16, "sine", 0.045);
          } else if (name === "timeout") {
            this.tone(330, 0, 0.12, "triangle", 0.034);
            this.tone(247, 0.13, 0.18, "triangle", 0.032);
          }
        },
        stopVoice() {
          if (!this.voice) return;
          this.voice.pause();
          this.voice.currentTime = 0;
          this.voice = null;
        },
        playVoice(name, onDone) {
          const src = this.voiceFiles[name];
          if (!src) return;
          this.stopVoice();
          const audio = new Audio(src);
          audio.preload = "auto";
          audio.volume = 0.96;
          this.voice = audio;
          audio.addEventListener("ended", () => {
            if (this.voice === audio) this.voice = null;
            if (typeof onDone === "function") onDone();
          });
          audio.addEventListener("error", () => {
            if (this.voice === audio) this.voice = null;
            if (typeof onDone === "function") onDone();
          });
          audio.play().catch(() => {
            if (this.voice === audio) this.voice = null;
            if (typeof onDone === "function") onDone();
          });
        }
      };

      const el = {
        gameCard: document.getElementById("gameCard"),
        timer: document.getElementById("timer"),
        questionIndex: document.getElementById("questionIndex"),
        score: document.getElementById("score"),
        combo: document.getElementById("combo"),
        structureText: document.getElementById("structureText"),
        ghostChar: document.getElementById("ghostChar"),
        slots: document.getElementById("slots"),
        targetChar: document.getElementById("targetChar"),
        questionHint: document.getElementById("questionHint"),
        partsGrid: document.getElementById("partsGrid"),
        feedback: document.getElementById("feedback"),
        startBtn: document.getElementById("startBtn"),
        resetBtn: document.getElementById("resetBtn"),
        nextBtn: document.getElementById("nextBtn"),
        startOverlay: document.getElementById("startOverlay"),
        resultOverlay: document.getElementById("resultOverlay"),
        resultTitle: document.getElementById("resultTitle"),
        resultText: document.getElementById("resultText"),
        restartBtn: document.getElementById("restartBtn")
      };

      function shuffle(items) {
        return [...items]
          .map((value) => ({ value, sort: Math.random() }))
          .sort((a, b) => a.sort - b.sort)
          .map(({ value }) => value);
      }

      function updateHud() {
        el.timer.textContent = state.time;
        el.timer.classList.toggle("danger", state.time <= 10 && state.running);
        if (state.running && state.time <= 10 && state.time > 0 && !sound.warnedTimes.has(state.time)) {
          sound.warnedTimes.add(state.time);
          sound.play("tick");
        }
        el.questionIndex.textContent = `第 ${state.current + 1}/${questions.length} 题`;
        el.score.textContent = `得分 ${state.score}`;
        el.combo.textContent = `连击 x${state.combo.toFixed(1)}`;
      }

      function loadQuestion(index, announce = true) {
        const q = questions[index];
        state.solved = false;
        state.selectedPiece = null;
        state.placements = Array(q.answer.length).fill(null);
        el.structureText.textContent = q.structure;
        el.ghostChar.textContent = q.target;
        el.targetChar.textContent = q.target;
        el.questionHint.textContent = q.hint;
        document.getElementById("outlineBox").className = `outline-box ${q.layout}`;
        el.nextBtn.hidden = true;
        el.feedback.className = "feedback";
        el.feedback.textContent = state.running ? "把部件放到正确槽位，拼好后会自动判断" : "点击“开始挑战”后开始计时";

        el.slots.className = `slots ${q.layout}`;
        el.slots.innerHTML = "";
        q.slots.forEach((label, slotIndex) => {
          const slot = document.createElement("button");
          slot.className = "slot";
          slot.type = "button";
          slot.dataset.index = slotIndex;
          slot.dataset.label = label;
          slot.addEventListener("click", () => {
            if (state.selectedPiece) {
              placePiece(state.selectedPiece, slotIndex);
            } else if (state.placements[slotIndex]) {
              removePlacement(slotIndex, true);
            }
          });
          el.slots.appendChild(slot);
        });

        el.partsGrid.innerHTML = "";
        shuffle(q.pieces.map((text, pieceIndex) => ({ text, pieceIndex }))).forEach((piece, visualIndex) => {
          const btn = document.createElement("button");
          btn.className = "piece";
          btn.type = "button";
          btn.textContent = piece.text;
          btn.dataset.id = `${index}-${piece.pieceIndex}-${piece.text}`;
          btn.dataset.text = piece.text;
          btn.style.setProperty("--piece-color", colors[visualIndex % colors.length]);
          btn.addEventListener("click", () => selectPiece(btn));
          btn.addEventListener("pointerdown", (event) => startDrag(event, btn));
          el.partsGrid.appendChild(btn);
        });

        updateHud();
        if (announce && state.running && q.voice) {
          setTimeout(() => {
            if (state.running && state.current === index && !state.solved) sound.playVoice(q.voice);
          }, 260);
        }
      }

      function startGame() {
        sound.play("start");
        sound.warnedTimes.clear();
        clearInterval(state.timerId);
        state.current = 0;
        state.time = 60;
        state.score = 0;
        state.correct = 0;
        state.combo = 1;
        state.running = true;
        el.startOverlay.hidden = true;
        el.resultOverlay.hidden = true;
        el.startBtn.textContent = "重新开始";
        loadQuestion(0, false);
        sound.playVoice("welcome", () => {
          if (state.running && state.current === 0 && !state.solved) sound.playVoice("q1");
        });
        state.timerId = setInterval(() => {
          if (!state.running) return;
          state.time -= 1;
          updateHud();
          if (state.time <= 0) finishGame("时间到");
        }, 1000);
      }

      function selectPiece(piece) {
        if (!state.running || state.solved || piece.classList.contains("used")) return;
        document.querySelectorAll(".piece.selected").forEach((node) => node.classList.remove("selected"));
        state.selectedPiece = piece;
        piece.classList.add("selected");
        sound.play("select");
      }

      function startDrag(event, piece) {
        if (!state.running || state.solved || piece.classList.contains("used")) return;
        selectPiece(piece);
        piece.setPointerCapture(event.pointerId);
        const clone = piece.cloneNode(true);
        clone.classList.add("dragging");
        document.body.appendChild(clone);
        state.dragging = { source: piece, clone };
        moveDrag(event);
        piece.addEventListener("pointermove", moveDrag);
        piece.addEventListener("pointerup", endDrag, { once: true });
        piece.addEventListener("pointercancel", endDrag, { once: true });
      }

      function moveDrag(event) {
        if (!state.dragging) return;
        state.dragging.clone.style.left = `${event.clientX}px`;
        state.dragging.clone.style.top = `${event.clientY}px`;
        document.querySelectorAll(".slot").forEach((slot) => slot.classList.remove("hover"));
        const slot = document.elementFromPoint(event.clientX, event.clientY)?.closest?.(".slot");
        if (slot) slot.classList.add("hover");
      }

      function endDrag(event) {
        const active = state.dragging;
        if (!active) return;
        active.source.removeEventListener("pointermove", moveDrag);
        active.clone.remove();
        state.dragging = null;
        const slot = document.elementFromPoint(event.clientX, event.clientY)?.closest?.(".slot");
        document.querySelectorAll(".slot").forEach((node) => node.classList.remove("hover"));
        if (slot) {
          placePiece(active.source, Number(slot.dataset.index));
        }
      }

      function startPlacedDrag(event, slotIndex) {
        if (!state.running || state.solved || !state.placements[slotIndex]) return;
        event.stopPropagation();
        event.preventDefault();
        const placed = event.currentTarget;
        const clone = placed.cloneNode(true);
        clone.classList.add("dragging");
        document.body.appendChild(clone);
        const movePlaced = (moveEvent) => {
          clone.style.left = `${moveEvent.clientX}px`;
          clone.style.top = `${moveEvent.clientY}px`;
          document.querySelectorAll(".slot").forEach((slot) => slot.classList.remove("hover"));
          const hoverSlot = document.elementFromPoint(moveEvent.clientX, moveEvent.clientY)?.closest?.(".slot");
          if (hoverSlot) hoverSlot.classList.add("hover");
        };
        const finishPlacedDrag = (clientX, clientY) => {
          document.removeEventListener("pointermove", movePlaced);
          document.removeEventListener("pointerup", endPlaced);
          document.removeEventListener("pointercancel", cancelPlaced);
          clone.remove();
          document.querySelectorAll(".slot").forEach((node) => node.classList.remove("hover"));
          const dropSlot = document.elementFromPoint(clientX, clientY)?.closest?.(".slot");
          const dropIndex = dropSlot ? Number(dropSlot.dataset.index) : null;
          const currentPlacement = state.placements[slotIndex];
          if (!currentPlacement) return;
          if (dropIndex === slotIndex) return;
          const sourcePiece = document.querySelector(`.piece[data-id="${currentPlacement.id}"]`);
          if (dropSlot && sourcePiece) {
            removePlacement(slotIndex, false);
            placePiece(sourcePiece, dropIndex);
          } else {
            el.feedback.className = "feedback";
            removePlacement(slotIndex, false);
            el.feedback.textContent = "已取回部件，可重新摆放";
          }
        };
        const endPlaced = (upEvent) => finishPlacedDrag(upEvent.clientX, upEvent.clientY);
        const cancelPlaced = (cancelEvent) => finishPlacedDrag(cancelEvent.clientX, cancelEvent.clientY);
        movePlaced(event);
        document.addEventListener("pointermove", movePlaced);
        document.addEventListener("pointerup", endPlaced);
        document.addEventListener("pointercancel", cancelPlaced);
      }

      function finishNativePlacedDrag(event, slotIndex) {
        if (!state.running || state.solved || !state.placements[slotIndex]) return;
        const dropSlot = document.elementFromPoint(event.clientX, event.clientY)?.closest?.(".slot");
        const dropIndex = dropSlot ? Number(dropSlot.dataset.index) : null;
        if (dropIndex === slotIndex) return;
        const currentPlacement = state.placements[slotIndex];
        const sourcePiece = document.querySelector(`.piece[data-id="${currentPlacement.id}"]`);
        if (dropSlot && sourcePiece) {
          removePlacement(slotIndex, false);
          placePiece(sourcePiece, dropIndex);
        } else {
          removePlacement(slotIndex, true);
        }
      }

      function removePlacement(slotIndex, showFeedback = true) {
        const placed = state.placements[slotIndex];
        if (!placed) return;
        const sourcePiece = document.querySelector(`.piece[data-id="${placed.id}"]`);
        if (sourcePiece) sourcePiece.classList.remove("used", "selected");
        state.placements[slotIndex] = null;
        const slot = el.slots.querySelector(`[data-index="${slotIndex}"]`);
        if (slot) {
          slot.classList.remove("filled");
          slot.innerHTML = "";
        }
        state.selectedPiece = null;
        sound.play("return");
        if (showFeedback) sound.playVoice("return");
        if (showFeedback) {
          el.feedback.className = "feedback";
          el.feedback.textContent = "已取回部件，可重新摆放";
        }
      }

      function placePiece(piece, slotIndex) {
        if (!state.running || state.solved || !piece || piece.classList.contains("used")) return;
        const slot = el.slots.querySelector(`[data-index="${slotIndex}"]`);
        if (!slot) return;
        if (state.placements[slotIndex]) {
          const oldPiece = document.querySelector(`.piece[data-id="${state.placements[slotIndex].id}"]`);
          if (oldPiece) oldPiece.classList.remove("used");
        }
        const color = piece.style.getPropertyValue("--piece-color");
        state.placements[slotIndex] = {
          id: piece.dataset.id,
          text: piece.dataset.text,
          color
        };
        piece.classList.add("used");
        piece.classList.remove("selected");
        state.selectedPiece = null;
        slot.classList.add("filled");
        slot.innerHTML = `<div class="placed-piece" role="button" tabindex="0" draggable="true" title="点击或拖出可取回" style="--piece-color:${color}">${piece.dataset.text}</div>`;
        const placedNode = slot.querySelector(".placed-piece");
        sound.play("place");
        placedNode.addEventListener("click", (event) => {
          event.stopPropagation();
          removePlacement(slotIndex, true);
        });
        placedNode.addEventListener("pointerdown", (event) => startPlacedDrag(event, slotIndex));
        placedNode.addEventListener("dragstart", (event) => {
          event.stopPropagation();
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", String(slotIndex));
        });
        placedNode.addEventListener("dragend", (event) => finishNativePlacedDrag(event, slotIndex));

        if (state.placements.every(Boolean)) {
          checkAnswer(true);
        }
      }

      function resetCurrent(showFeedback = true) {
        const q = questions[state.current];
        state.placements = Array(q.answer.length).fill(null);
        state.selectedPiece = null;
        document.querySelectorAll(".piece").forEach((piece) => piece.classList.remove("used", "selected"));
        document.querySelectorAll(".slot").forEach((slot) => {
          slot.classList.remove("filled", "hover");
          slot.innerHTML = "";
        });
        if (showFeedback) {
          sound.play("return");
          el.feedback.className = "feedback";
          el.feedback.textContent = "已清空，重新摆放";
        }
      }

      function checkAnswer(auto = false) {
        if (!state.running || state.solved) return;
        const q = questions[state.current];
        if (state.placements.some((item) => !item)) {
          el.feedback.className = "feedback bad";
          el.feedback.textContent = "还有位置没放满";
          return;
        }
        const currentAnswer = state.placements.map((item) => item.text);
        const correct = currentAnswer.every((text, index) => text === q.answer[index]);
        if (correct) {
          sound.play("correct");
          sound.playVoice("correct");
          state.solved = true;
          state.correct += 1;
          state.score += Math.round(20 * state.combo);
          state.combo = Math.round((state.combo + 0.2) * 10) / 10;
          state.time += 5;
          el.feedback.className = "feedback good";
          el.feedback.textContent = "太棒了！时间 +5 秒";
          el.gameCard.classList.add("celebrate");
          burstConfetti();
          setTimeout(() => el.gameCard.classList.remove("celebrate"), 1000);
          updateHud();
          if (state.current === questions.length - 1) {
            setTimeout(() => finishGame("挑战完成"), 900);
          } else {
            el.nextBtn.hidden = false;
            setTimeout(() => nextQuestion(), 1200);
          }
        } else {
          sound.play("wrong");
          sound.playVoice("wrong");
          state.combo = 1;
          el.feedback.className = "feedback bad";
          el.feedback.textContent = auto ? "再试试看，部件会弹回" : "再试试看";
          el.gameCard.classList.add("shake");
          setTimeout(() => el.gameCard.classList.remove("shake"), 380);
          setTimeout(() => resetCurrent(false), 520);
          updateHud();
        }
      }

      function nextQuestion() {
        if (!state.running || !state.solved) return;
        if (state.current >= questions.length - 1) {
          finishGame("挑战完成");
          return;
        }
        state.current += 1;
        loadQuestion(state.current);
      }

      function finishGame(title) {
        state.running = false;
        clearInterval(state.timerId);
        sound.play(title === "时间到" ? "timeout" : "finish");
        sound.playVoice(title === "时间到" ? "timeout" : "finish");
        el.resultTitle.textContent = title;
        el.resultText.textContent = `本次得分 ${state.score}，答对 ${state.correct} 题，剩余 ${Math.max(state.time, 0)} 秒。`;
        el.resultOverlay.hidden = false;
        updateHud();
      }

      function burstConfetti() {
        const palette = ["#ff8fb0", "#fff44f", "#98ff98", "#7edbff", "#cab7ff", "#ffa500"];
        for (let i = 0; i < 18; i += 1) {
          const piece = document.createElement("div");
          piece.className = "confetti";
          piece.style.setProperty("--c", palette[i % palette.length]);
          piece.style.setProperty("--x", `${(Math.random() - 0.5) * 560}px`);
          piece.style.setProperty("--y", `${180 + Math.random() * 260}px`);
          document.querySelector(".shell").appendChild(piece);
          setTimeout(() => piece.remove(), 1050);
        }
      }

      el.startBtn.addEventListener("click", startGame);
      el.startOverlay.addEventListener("click", startGame);
      el.restartBtn.addEventListener("click", startGame);
      el.resetBtn.addEventListener("click", () => resetCurrent(true));
      el.nextBtn.addEventListener("click", nextQuestion);

      loadQuestion(0);
      updateHud();
    </script>
  </body>
</html>
